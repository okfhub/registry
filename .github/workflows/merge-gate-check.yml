# Merge-gate CHECK — runs the four publish-PR checks on a fork PR (no secrets).
#
# SECURITY: uses on: pull_request_target (NOT pull_request). With
# pull_request_target, the workflow file + checked-out scripts come from the
# DEFAULT BRANCH (main), not the PR's fork. A contributor CANNOT modify the
# workflow or the gate scripts in their PR to exfiltrate secrets — their
# modifications are never executed. The scripts fetch the PR's manifest via the
# GitHub Contents API (using github.event.pull_request.head.sha from the webhook
# payload), not from the checkout, so they still validate the PR's content.
#
# Secrets ARE available under pull_request_target (unlike pull_request from a
# fork), but this workflow deliberately references NONE — only the default
# GITHUB_TOKEN (contents:read, pull-requests:read). The three repo secrets
# (OKFHUB_APP_PRIVATE_KEY, OKFHUB_WEBSITE_TOKEN, UPSTASH_REDIS_REST_TOKEN)
# are used exclusively by merge-gate-merge.yml and build-registry.yml, which
# run in the default-branch context (workflow_run / push) and never on a
# fork PR.
#
# It CANNOT comment or merge (the permissions block is read-only by design).
# The downstream merge-gate-merge.yml (on: workflow_run) watches this green
# signal, then mints the App token (secret available in the default-branch
# workflow_run context) to merge + post the result comment.
name: Merge publish PR (check)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read         # read the PR manifest via the Contents API
  pull-requests: read    # read PR state + changed files
  # NOTE: deliberately NO write scopes. Even though pull_request_target grants
  # a write-capable GITHUB_TOKEN, this workflow never writes — commenting +
  # merging happen in merge-gate-merge.yml (workflow_run context).

jobs:
  check:
    # Only gate PRs targeting main (publish PRs land on main).
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout under pull_request_target checks out the DEFAULT BRANCH
      # (main), not the PR's fork. This is intentional: the gate scripts come
      # from the trusted base, not PR-authored code. The scripts fetch the PR's
      # manifest via the GitHub API (clone-source.mjs uses the Contents API with
      # the PR head SHA from the webhook payload).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install the check scripts' deps (zod + gray-matter for structure.mjs).
      # npm ci uses the base branch's package.json — a PR cannot inject deps.
      - name: Install check deps
        run: npm ci
        working-directory: scripts/checks

      # Clone the PR's source bundle for the structural-identity check (#5,
      # Phase 4 D-02 / VAL-02). Reads the manifest at the PR head, downloads the
      # public source tarball via GITHUB_TOKEN, validates no path-traversal /
      # symlink escapes (T-04-PATH / T-04-SYM), and extracts it. The bundleDir is
      # exported as STRUCTURE_BUNDLE_DIR for the gate-check step. CHECK HALF ONLY
      # — the merge half (App token) cannot clone arbitrary sources (T-04-SCOPE).
      # No `set -x` — keep the habit of not echoing tokens.
      - name: Clone source bundle
        id: clone-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$(node scripts/checks/clone-source.mjs)"
          if [ -n "$OUT" ]; then
            echo "bundleDir=$(echo "$OUT" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).bundleDir')" >> "$GITHUB_OUTPUT"
          fi

      # Run the five checks with the default GITHUB_TOKEN. STRUCTURE_BUNDLE_DIR
      # gates check #5 — present here (check half cloned the source), absent in
      # the merge half (which trusts this run's conclusion — D-02). No `set -x`.
      - name: Run gate-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURE_BUNDLE_DIR: ${{ steps.clone-source.outputs.bundleDir }}
        run: node scripts/checks/gate-check.mjs
