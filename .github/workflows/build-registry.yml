# Build registry.json — validates every manifest, computes structural evidence
# INLINE (Phase 4 Option A), and commits the aggregated index cross-repo into
# okfhub-website/public/registry.json (D-04 one-way contract). Triggered by a
# manifest push, weekly (D-06 decay recompute of source-reachable), or manually.
#
# EVIDENCE INLINE (Option A): build-registry.mjs clones each manifest's source
# and runs verifyBundle, embedding the evidence object directly into registry.json.
# This replaced the sidecar+separate-workflow design (evidence-compute.yml) after
# it was proven that protected main rejects the App's direct sidecar push
# (required_status_checks blocks direct pushes regardless of bypass — verified
# with classic GH006 and Rulesets GH013). Routing evidence through the
# registry.json → website channel touches no protected branch. The weekly
# schedule preserves D-06: source-reachable is decay-able, so evidence is
# recomputed on a cadence even without a publish.
#
# The cross-repo push uses a fine-grained PAT (OKFHUB_WEBSITE_TOKEN, D-05)
# scoped to asagajda/okfhub-website ONLY — the default GITHUB_TOKEN cannot push
# cross-repo. The push step runs with `set -e` and NEVER echoes commands (no
# shell tracing) so the token-bearing git remote URL is never logged (RESEARCH §1.2).
name: Build registry.json

on:
  push:
    paths:
      # D-20 fix (Phase 3): single-segment glob matches ANY io.github.<org>
      # namespace, so external publishes (io.github.stripe/, io.github.<login>/)
      # trigger the aggregator the same as io.github.google/. Previously this
      # was `io.github.google/**/*.json` — only the google namespace propagated,
      # silently dropping every external publish. Do NOT revert to the google-
      # only filter.
      - "io.github.*/*.json"
  schedule:
    # Weekly, Monday 03:00 UTC — D-06 decay recompute. source-reachable is the
    # only decay-able evidence check (the content checks are immutable at a
    # pinned SHA); the weekly run refreshes it without waiting for a publish.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Root deps (zod) + checks deps (gray-matter — structure.mjs needs it for
      # frontmatter parsing). build-registry.mjs imports from scripts/checks/.
      - run: npm ci
      - run: npm ci
        working-directory: scripts/checks
      # GITHUB_TOKEN clones the public source repos for evidence compute (sources
      # are public; the token avoids rate limits). Same pattern as merge-gate-check.
      - run: node scripts/build-registry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push registry.json + concept bodies to okfhub-website
        env:
          SITE_TOKEN: ${{ secrets.OKFHUB_WEBSITE_TOKEN }}
        run: |
          set -e
          # asagajda/okfhub-website is PRIVATE — both clone and push need the PAT
          # (an unauthenticated clone fails in CI: "could not read Username").
          # SITE_TOKEN is passed via env, never echoed (no shell tracing).
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/asagajda/okfhub-website.git" /tmp/site
          cp registry.json /tmp/site/public/registry.json
          # Phase 5 (D-04/D-05): also push the materialized concept-body tree.
          # concepts/ is produced by build-registry.mjs alongside registry.json and
          # read by the gateway via fs.readFile (the same public/ channel). rsync
          # --delete prunes concepts removed from a bundle since the last run (a
          # plain `cp -r` would leave stale bodies). The concepts/ dir is absent
          # when every bundle failed to clone — guard with the existence check so
          # the push still ships registry.json alone in that degraded case.
          if [ -d concepts ]; then
            mkdir -p /tmp/site/public
            rsync -a --delete concepts/ /tmp/site/public/concepts/
          else
            echo "no concepts/ tree this run (all bundles evidence-pending) — leaving public/concepts as-is"
          fi
          cd /tmp/site
          git config user.name "okfhub-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry.json
          # CR-02: guard the concepts add. When concepts/ was NOT produced this run
          # AND the freshly-cloned site does not yet contain a public/concepts/ dir
          # (true on the very first run, and after any run that previously failed
          # before pushing concepts), an unconditional `git add public/concepts`
          # errors with "fatal: pathspec 'public/concepts' did not match any files".
          # Under `set -e` that aborts the whole step, so registry.json is NEVER
          # committed/pushed — the opposite of the stated invariant ("one bad
          # bundle never blocks the index"). Guard it so the index ships alone in
          # the degraded case.
          if [ -d public/concepts ]; then
            git add public/concepts
          fi
          if git diff --staged --quiet; then
            echo "no change — registry.json + concepts already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate registry.json + concept bodies [skip ci]"
          git push "https://x-access-token:${SITE_TOKEN}@github.com/asagajda/okfhub-website.git" main
