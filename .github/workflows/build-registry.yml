# Build registry.json — validates every manifest and commits the aggregated
# index cross-repo into okfhub-website/public/registry.json (D-04 one-way
# contract). Triggered by a manifest push or manually via workflow_dispatch.
#
# The cross-repo push uses a fine-grained PAT (OKFHUB_WEBSITE_TOKEN, D-05)
# scoped to asagajda/okfhub-website ONLY — the default GITHUB_TOKEN cannot push
# cross-repo. The push step runs with `set -e` and NO `set -x` so the
# token-bearing git remote URL is never echoed to the log (RESEARCH §1.2).
name: Build registry.json

on:
  push:
    paths:
      # D-20 fix (Phase 3): single-segment glob matches ANY io.github.<org>
      # namespace, so external publishes (io.github.stripe/, io.github.<login>/)
      # trigger the aggregator the same as io.github.google/. Previously this
      # was `io.github.google/**/*.json` — only the google namespace propagated,
      # silently dropping every external publish. Do NOT revert to the google-
      # only filter.
      - "io.github.*/*.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node scripts/build-registry.mjs

      - name: Push registry.json to okfhub-website
        env:
          SITE_TOKEN: ${{ secrets.OKFHUB_WEBSITE_TOKEN }}
        run: |
          set -e
          # asagajda/okfhub-website is PRIVATE — both clone and push need the PAT
          # (an unauthenticated clone fails in CI: "could not read Username").
          # SITE_TOKEN is passed via env, never echoed (no `set -x`).
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/asagajda/okfhub-website.git" /tmp/site
          cp registry.json /tmp/site/public/registry.json
          cd /tmp/site
          git config user.name "okfhub-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry.json
          if git diff --staged --quiet; then
            echo "no change — registry.json already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate registry.json [skip ci]"
          git push "https://x-access-token:${SITE_TOKEN}@github.com/asagajda/okfhub-website.git" main
